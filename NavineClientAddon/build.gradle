plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

version = '1.0.0'
group = 'com.navine.clientaddon'

base {
    archivesName = 'NavineClientAddon'
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.150.0+26.1.2'
    compileOnly name: 'Navine-Client'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    destinationDirectory = file('build/output')
    archiveFileName = 'NavineClientAddon.jar'
}

tasks.register('deploy', Copy) {
    dependsOn jar
    from jar.archiveFile
    into file('C:/Users/hitbo/curseforge/minecraft/Instances/navine-client (1)/mods')
    doFirst {
        delete file('C:/Users/hitbo/curseforge/minecraft/Instances/navine-client (1)/mods/NavineClientAddon.jar')
    }
}
