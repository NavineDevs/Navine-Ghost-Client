<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Ghost Injector</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="titlebar">
      <div class="titlebar-drag">
        <span class="title-dot" aria-hidden="true"></span>
        <span class="title-brand" id="brand">NAVINE</span>
        <span class="title-sep" aria-hidden="true"></span>
        <span class="title-name">Ghost Injector</span>
      </div>
      <div class="titlebar-actions">
        <button type="button" class="win-btn" id="minBtn" title="Minimize" aria-label="Minimize">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 5h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="win-btn close" id="closeBtn" title="Close" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <main class="main">
      <section class="hero">
        <p class="eyebrow" id="eyebrow">Ghost Client</p>
        <h1>Inject</h1>
        <p class="sub">Start Minecraft first, pick a version, then inject.</p>
      </section>

      <div class="panel">
        <label class="field" for="versionBtn">
          <span>Minecraft version</span>
          <div class="picker" id="picker">
            <button type="button" class="picker-btn" id="versionBtn" aria-haspopup="listbox" aria-expanded="false">
              <span id="versionLabel">26.1.2</span>
              <span class="chev" aria-hidden="true"></span>
            </button>
            <ul class="picker-menu" id="versionMenu" role="listbox" hidden></ul>
          </div>
        </label>

        <button id="inject" type="button">Inject</button>
        <p class="status" id="status">Ready</p>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
